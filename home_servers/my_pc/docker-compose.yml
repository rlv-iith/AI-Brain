services:

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    # ── GPU (uncomment if PC has NVIDIA GPU) ──────────────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Pulls the reasoning model on first run, then exits
  model-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "sleep 5 &&
             ollama pull deepseek-r1:7b &&
             echo 'Model ready'"
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

  # Cloudflare tunnel — exposes Ollama to the internet
  # Copy the public URL → paste in 05/.env as HOME_PC_URL
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
